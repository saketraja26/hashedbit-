<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic CSS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="text"], input[type="range"], select {
            padding: 12px;
            margin: 10px 5px;
            border: 2px solid #ff6b6b;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin: 10px 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #text-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <!-- html code goes here -->
    <div class='text-here' id='text-container'>This is some example text</div>

    <input type="text" id="colorbox" placeholder="Enter color">
    <button id="colorchange" onclick="changeColor()">Change Colour</button>

    <br><br>

    <input type="range" id="fontsize" min="10" max="100" value="55" oninput="changeFontSize()">
    <br><br>

    <button id="italic" class="stylebt" onclick="makeItalic()">Italics</button>
    <button id="underline" class="stylebt" onclick="makeUnderline()">Underline</button>
    <button id="bold" class="stylebt" onclick="makeBold()">Bold</button>

    <br><br>

    <select id="list" onchange="changeFont()">
        <option value="serif">Serif</option>
        <option value="sans-serif">Sans-Serif</option>
        <option value="monospace">Monospace</option>
        <option value="cursive">Cursive</option>
        <option value="fantasy">Fantasy</option>
    </select>

    <br><br>

    <button id="getstyle" onclick="getCSS()">Get CSS</button>

    <br><br>
    <p id="css-props"></p>

    <script src="script.js"></script>
</body>
</html>
